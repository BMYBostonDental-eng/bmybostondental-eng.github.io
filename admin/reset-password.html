<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset BMY Admin Password</title><style>
:root{--red:#8f171b;--red2:#681014;--ink:#242424;--muted:#6d6662;--paper:#f6f1ec;--white:#fff;--line:#dfd0c7;--ok:#176b3a;--bad:#a12020}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at top left,rgba(143,23,27,.08),transparent 34%),var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
.shell{width:min(760px,100%);margin:5vh auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:36px;height:36px;border:10px solid var(--red);border-radius:50%}.brand strong{font-size:1.35rem}.brand span{display:block;color:var(--muted);font-size:.9rem}
.card{background:var(--white);border:1px solid var(--line);border-top:8px solid var(--red);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 50px rgba(70,42,30,.11)}
h1,h2{margin-top:0}h1{font-size:clamp(1.7rem,5vw,2.45rem);margin-bottom:8px}p{line-height:1.55}.lead{color:var(--muted);margin-top:0}
label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;padding:14px 15px;border:1px solid #baa99f;border-radius:11px;background:#fff;color:var(--ink);font:inherit}input:focus{outline:3px solid rgba(143,23,27,.16);border-color:var(--red)}
button,.button-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:11px;padding:12px 20px;background:var(--red);color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}button:hover,.button-link:hover{background:var(--red2)}button.secondary,.button-link.secondary{background:#eee6e1;color:var(--red2)}button:disabled{opacity:.6;cursor:wait}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin-top:22px}.text-button{padding:0;min-height:auto;background:transparent;color:var(--red);text-decoration:underline;font-weight:700}.text-button:hover{background:transparent;color:var(--red2)}
.notice{display:none;margin-top:18px;padding:13px 15px;border-radius:10px;line-height:1.45}.notice.show{display:block}.notice.success{background:#e6f4eb;color:var(--ok)}.notice.error{background:#fbe8e8;color:var(--bad)}.notice.info{background:#f2eeeb;color:#514843}
.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:28px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fffdfc}.metric span{display:block;color:var(--muted);font-size:.88rem}.metric strong{display:block;margin-top:7px;font-size:1.2rem}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#f0e4df;color:var(--red2);font-weight:800;text-transform:uppercase;font-size:.75rem;letter-spacing:.04em}.security{margin-top:24px;padding:15px;background:#faf6f3;border-left:4px solid var(--red);color:var(--muted)}
@media(max-width:600px){body{padding:14px}.shell{margin:2vh auto}.grid{grid-template-columns:1fr}.actions>*{width:100%}}
</style></head>
<body><main class="shell"><div class="brand"><div class="mark"></div><div><strong>BMY Dental</strong><span>Private campaign administration</span></div></div><section class="card"><h1>Choose a new password</h1><p class="lead">Use a strong password unique to this administrator account.</p><form id="form"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" minlength="12" required><label for="p2">Confirm new password</label><input id="p2" type="password" autocomplete="new-password" minlength="12" required><div class="actions"><button id="save">Update password</button><a class="button-link secondary" href="./">Return to login</a></div></form><div id="notice" class="notice"></div><div class="security">Open this page using the reset link sent by Supabase.</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://mpyvzsfghxqppmaozcrb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_frWVqQ-gQkmWp9Y0hrWlbw_PydxExjM';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
 auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const form=document.getElementById("form"),save=document.getElementById("save"),notice=document.getElementById("notice");let ready=false;function show(msg,type){notice.textContent=msg;notice.className=`notice show ${type}`}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||session?.user){ready=true;show("Reset link verified. Enter your new password.","info")}});
async function check(){const{data:{session},error}=await supabaseClient.auth.getSession();if(error){show(error.message,"error");return}if(session?.user){ready=true;show("Reset link verified. Enter your new password.","info")}else show("Open this page using the password-reset link from your email.","error")}
form.addEventListener("submit",async e=>{e.preventDefault();const p1=document.getElementById("p1").value,p2=document.getElementById("p2").value;if(!ready){show("The password-reset session is not active.","error");return}if(p1.length<12){show("Use at least 12 characters.","error");return}if(p1!==p2){show("The two passwords do not match.","error");return}save.disabled=true;save.textContent="Updating…";try{const{error}=await supabaseClient.auth.updateUser({password:p1});if(error)throw error;show("Password updated successfully. Return to the login page.","success");form.reset()}catch(e){show(e.message||"Unable to update the password.","error")}finally{save.disabled=false;save.textContent="Update password"}});check();</script></body></html>
