<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BMY Campaign Admin Login</title><style>
:root{--red:#8f171b;--red2:#681014;--ink:#242424;--muted:#6d6662;--paper:#f6f1ec;--white:#fff;--line:#dfd0c7;--ok:#176b3a;--bad:#a12020}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at top left,rgba(143,23,27,.08),transparent 34%),var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
.shell{width:min(760px,100%);margin:5vh auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:36px;height:36px;border:10px solid var(--red);border-radius:50%}.brand strong{font-size:1.35rem}.brand span{display:block;color:var(--muted);font-size:.9rem}
.card{background:var(--white);border:1px solid var(--line);border-top:8px solid var(--red);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 50px rgba(70,42,30,.11)}
h1,h2{margin-top:0}h1{font-size:clamp(1.7rem,5vw,2.45rem);margin-bottom:8px}p{line-height:1.55}.lead{color:var(--muted);margin-top:0}
label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;padding:14px 15px;border:1px solid #baa99f;border-radius:11px;background:#fff;color:var(--ink);font:inherit}input:focus{outline:3px solid rgba(143,23,27,.16);border-color:var(--red)}
button,.button-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:11px;padding:12px 20px;background:var(--red);color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}button:hover,.button-link:hover{background:var(--red2)}button.secondary,.button-link.secondary{background:#eee6e1;color:var(--red2)}button:disabled{opacity:.6;cursor:wait}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin-top:22px}.text-button{padding:0;min-height:auto;background:transparent;color:var(--red);text-decoration:underline;font-weight:700}.text-button:hover{background:transparent;color:var(--red2)}
.notice{display:none;margin-top:18px;padding:13px 15px;border-radius:10px;line-height:1.45}.notice.show{display:block}.notice.success{background:#e6f4eb;color:var(--ok)}.notice.error{background:#fbe8e8;color:var(--bad)}.notice.info{background:#f2eeeb;color:#514843}
.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:28px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fffdfc}.metric span{display:block;color:var(--muted);font-size:.88rem}.metric strong{display:block;margin-top:7px;font-size:1.2rem}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#f0e4df;color:var(--red2);font-weight:800;text-transform:uppercase;font-size:.75rem;letter-spacing:.04em}.security{margin-top:24px;padding:15px;background:#faf6f3;border-left:4px solid var(--red);color:var(--muted)}
@media(max-width:600px){body{padding:14px}.shell{margin:2vh auto}.grid{grid-template-columns:1fr}.actions>*{width:100%}}
</style></head>
<body><main class="shell"><div class="brand"><div class="mark"></div><div><strong>BMY Dental</strong><span>Private campaign administration</span></div></div>
<section class="card"><div id="loginPanel"><h1>Secure admin login</h1><p class="lead">Authorized BMY team members only.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button id="loginButton" type="submit">Sign in</button><button id="forgotButton" class="text-button" type="button">Forgot password?</button></div></form><div id="loginNotice" class="notice"></div></div>
<div id="resetPanel" class="hidden"><h2>Reset your password</h2><p class="lead">Enter the email used for your BMY administrator account.</p><form id="resetForm"><label for="resetEmail">Email address</label><input id="resetEmail" type="email" autocomplete="email" required><div class="actions"><button id="resetButton" type="submit">Send reset email</button><button id="backButton" class="secondary" type="button">Back to login</button></div></form><div id="resetNotice" class="notice"></div></div>
<div class="security">Patient files and messaging credentials are never stored on this public GitHub page.</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://mpyvzsfghxqppmaozcrb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_frWVqQ-gQkmWp9Y0hrWlbw_PydxExjM';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
 auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const loginPanel=document.getElementById("loginPanel"),resetPanel=document.getElementById("resetPanel"),loginForm=document.getElementById("loginForm"),resetForm=document.getElementById("resetForm"),loginButton=document.getElementById("loginButton"),resetButton=document.getElementById("resetButton"),forgotButton=document.getElementById("forgotButton"),backButton=document.getElementById("backButton"),loginNotice=document.getElementById("loginNotice"),resetNotice=document.getElementById("resetNotice");
function showNotice(el,msg,type){el.textContent=msg;el.className=`notice show ${type}`} function clearNotice(el){el.textContent="";el.className="notice"}
async function verifyAdmin(userId){const{data:profile,error}=await supabaseClient.from("sms_admin_profiles").select("user_id,full_name,role,active").eq("user_id",userId).maybeSingle();if(error)throw error;if(!profile||!profile.active){await supabaseClient.auth.signOut();throw new Error("This account does not have active BMY campaign access.")}window.location.replace("./dashboard.html")}
async function existing(){const{data:{session}}=await supabaseClient.auth.getSession();if(session?.user){try{await verifyAdmin(session.user.id)}catch(e){showNotice(loginNotice,e.message,"error")}}}
loginForm.addEventListener("submit",async e=>{e.preventDefault();clearNotice(loginNotice);loginButton.disabled=true;loginButton.textContent="Signing in…";try{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await verifyAdmin(data.user.id)}catch(e){showNotice(loginNotice,e.message||"Unable to sign in.","error")}finally{loginButton.disabled=false;loginButton.textContent="Sign in"}});
forgotButton.addEventListener("click",()=>{clearNotice(loginNotice);loginPanel.classList.add("hidden");resetPanel.classList.remove("hidden");document.getElementById("resetEmail").focus()});
backButton.addEventListener("click",()=>{clearNotice(resetNotice);resetPanel.classList.add("hidden");loginPanel.classList.remove("hidden");document.getElementById("email").focus()});
resetForm.addEventListener("submit",async e=>{e.preventDefault();clearNotice(resetNotice);resetButton.disabled=true;resetButton.textContent="Sending…";try{const email=document.getElementById("resetEmail").value.trim();const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:'https://bmybostondental-eng.github.io/admin/reset-password.html'});if(error)throw error;showNotice(resetNotice,"Password reset email sent. Check your inbox and spam folder.","success")}catch(e){showNotice(resetNotice,e.message||"Unable to send the reset email.","error")}finally{resetButton.disabled=false;resetButton.textContent="Send reset email"}});
existing();</script></body></html>
